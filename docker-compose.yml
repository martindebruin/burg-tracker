services:
  db:
    image: postgis/postgis:16-3.4
    container_name: bourgogne-postgis
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bourgogne-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: bourgogne-backend  # reuse the same image as backend
    container_name: bourgogne-seed
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: python seed.py
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - seed

  geocode:
    image: bourgogne-backend
    container_name: bourgogne-geocode
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: python geocode.py
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - geocode

  terroir:
    image: bourgogne-backend
    container_name: bourgogne-terroir
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: python terroir.py
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - terroir

  migrate:
    image: bourgogne-backend
    container_name: bourgogne-migrate
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: python migrate_terroir.py
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - migrate

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bourgogne-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pg_data:
