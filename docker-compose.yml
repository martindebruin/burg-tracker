services:
  db:
    image: postgis/postgis:16-3.4
    container_name: bourgogne-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: bourgogne
      POSTGRES_USER: martin
      POSTGRES_PASSWORD: expensivewino
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U martin -d bourgogne"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bourgogne-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://martin:expensivewino@db:5432/bourgogne
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: bourgogne-backend  # reuse the same image as backend
    container_name: bourgogne-seed
    restart: "no"
    environment:
      DATABASE_URL: postgresql://martin:expensivewino@db:5432/bourgogne
    command: python seed.py
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - seed

  geocode:
    image: bourgogne-backend
    container_name: bourgogne-geocode
    restart: "no"
    environment:
      DATABASE_URL: postgresql://martin:expensivewino@db:5432/bourgogne
    command: python geocode.py
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - geocode

  terroir:
    image: bourgogne-backend
    container_name: bourgogne-terroir
    restart: "no"
    environment:
      DATABASE_URL: postgresql://martin:expensivewino@db:5432/bourgogne
    command: python terroir.py
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - terroir

  migrate:
    image: bourgogne-backend
    container_name: bourgogne-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://martin:expensivewino@db:5432/bourgogne
    command: python migrate_terroir.py
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - migrate

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bourgogne-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pg_data:
